services:
  upconv:
    build: .
    image: video-upconv:local
    gpus: all
    user: "${UID:-1000}:${GID:-1000}"
    shm_size: 2gb
    volumes:
      - ./work:/work
      - ./cache:/cache
      # スクリプトの修正をイメージの再ビルドなしで反映する
      - ./upconv.py:/app/upconv.py:ro
      - ./face_swap.py:/app/face_swap.py:ro
